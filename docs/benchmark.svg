<text x="370.0" y="19" fill="#8b949e" text-anchor="middle" font-size="11">MiniLM-FineTuned-SNLI-MNLI, benchmark.py</text>
<text class="l0" x="18" y="46" xml:space="preserve"><tspan fill="#7ee787">$ </tspan><tspan fill="#e6edf3">python benchmark.py</tspan></text><text class="l1" x="18" y="66" fill="#8b949e" xml:space="preserve">Loading SNLI/MNLI test triplets (3,000)...</text><text class="l2" x="18" y="86" fill="#8b949e" xml:space="preserve">Encoding with this repo&#x27;s fine-tune...</text><text class="l3" x="18" y="106" fill="#8b949e" xml:space="preserve">Encoding with base all-MiniLM-L6-v2...</text><text class="l4" x="18" y="126" fill="#c9d1d9" xml:space="preserve">model                         triplet acc    retrieval</text><text class="l5" x="18" y="146" fill="#8b949e" xml:space="preserve">------------------------------------------------------</text><text class="l6" x="18" y="166" fill="#f85149" xml:space="preserve">this repo (SoftmaxLoss)            0.7007        7/24</text><text class="l7" x="18" y="186" fill="#3fb950" xml:space="preserve">base all-MiniLM-L6-v2              0.9430       24/24</text><text class="l8" x="18" y="206" fill="#8b949e" xml:space="preserve"># The fine-tune is 24 points behind the model it started from.</text><text class="l9" x="18" y="226" fill="#8b949e" xml:space="preserve"># SoftmaxLoss trains a classifier head over [u, v, |u-v|];</text><text class="l10" x="18" y="246" fill="#8b949e" xml:space="preserve"># it never asks the embeddings to be cosine-close.</text><text class="l11" x="18" y="266" fill="#79c0ff" xml:space="preserve"># Retrained with MultipleNegativesRankingLoss: 0.9453</text><text class="l12" x="18" y="286" fill="#8b949e" xml:space="preserve"># Recovers baseline, gains 0.2 points. The base model was</text><text class="l13" x="18" y="306" fill="#8b949e" xml:space="preserve"># already trained on SNLI/MNLI, so there was no headroom.</text>
</svg>